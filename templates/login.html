<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 미니 ERP</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }
        .login-brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
        }
        .account-hint {
            background: rgba(56, 189, 248, 0.08);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            font-size: 0.82rem;
            line-height: 1.5;
            color: #94a3b8;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="fa-solid fa-cubes"></i></div>
            <span>미니 ERP 로그인</span>
        </div>

        <!-- 오류 메시지 및 잠금 안내 경고 -->
        {% if error %}
        <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        {% if msg %}
        <div class="alert alert-success" style="margin-bottom: 1.25rem;">
            <i class="fa-solid fa-circle-check"></i> {{ msg }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label">아이디 (Username) *</label>
                <input type="text" name="username" class="form-control" placeholder="아이디를 입력하세요" required autofocus>
            </div>
            
            <div class="form-group" style="margin-top: 1.25rem;">
                <label class="form-label">비밀번호 (Password) *</label>
                <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 0.8rem; font-size: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> 로그인
            </button>
        </form>

        <div class="account-hint">
            <div style="font-weight: 700; color: #38bdf8; margin-bottom: 0.3rem;"><i class="fa-solid fa-key"></i> 기본 로그인 계정 안내</div>
            - <strong>관리자 (Admin)</strong>: 아이디 <code>admin</code> / 비번 <code>admin123</code><br>
            - <strong>일반 사용자 (User)</strong>: 아이디 <code>user1</code> / 비번 <code>user123</code>
        </div>
    </div>
</body>
</html>
